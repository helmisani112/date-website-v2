<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Date Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<form action="https://formspree.io/f/mredrkpd" method="POST">

  <div class="hearts">💖 💕 💗 💓</div>

  <!-- PAGE 1 -->
  <section class="page active" id="page1">
    <div class="card hero">
      <div class="icon">💌</div>

      <h1>Will you go on a date with me?</h1>

      <div class="buttons">
        <button type="button" class="primary" onclick="goPage(2)">
          Yes
        </button>

        <button type="button" id="noBtn">
          No
        </button>
      </div>
    </div>
  </section>

  <!-- PAGE 2 -->
  <section class="page" id="page2">
    <div class="card">

      <h1>So... when are you free?</h1>

      <label>Pick a date ✨</label>
      <input
        type="date"
        id="dateInput"
        name="date"
        required
      />

      <label>What time? 🥹</label>

      <select
        id="timeInput"
        name="time"
        required
      >
        <option value="">Select time...</option>
        <option>6:00 PM</option>
        <option>7:00 PM</option>
        <option>8:00 PM</option>
        <option>9:00 PM</option>
      </select>

      <button
        type="button"
        class="primary wide"
        onclick="goPage(3)"
      >
        okay next →
      </button>

    </div>
  </section>

  <!-- PAGE 3 -->
  <section class="page" id="page3">

    <h1>What are we feeling? 🍽️✨</h1>
    <p>You can pick one.</p>

    <div class="food-grid">

      <div class="food" onclick="chooseFood(this, 'Pizza')">
        🍕<span>Pizza</span>
      </div>

      <div class="food" onclick="chooseFood(this, 'Sushi')">
        🍣<span>Sushi</span>
      </div>

      <div class="food" onclick="chooseFood(this, 'Burger')">
        🍔<span>Burger</span>
      </div>

      <div class="food" onclick="chooseFood(this, 'Pasta')">
        🍝<span>Pasta</span>
      </div>

      <div class="food" onclick="chooseFood(this, 'Tacos')">
        🌮<span>Tacos</span>
      </div>

      <div class="food" onclick="chooseFood(this, 'Ramen')">
        🍜<span>Ramen</span>
      </div>

    </div>

    <!-- hidden form field -->
    <input
      type="hidden"
      id="foodInput"
      name="food"
    />

    <button
      type="submit"
      class="primary"
      onclick="showResult()"
    >
      this one! →
    </button>

  </section>

  <!-- PAGE 4 -->
  <section class="page" id="page4">

    <div class="card">

      <h1>It's a date! 💌</h1>

      <p class="small">
        Normal people text. I made a website. No big deal.
      </p>

      <div class="summary" id="summary"></div>

      <button
        type="button"
        class="primary wide"
        onclick="copyPlan()"
      >
        Copy plan & text me
      </button>

    </div>

  </section>

</form>

<script src="script.js"></script>

</body>
</html>
